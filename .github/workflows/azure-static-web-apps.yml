# Azure Static Web Apps CI/CD for Blazor WASM
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Get latest release tag
        id: latest_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-main}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore SFA_PWA/SFA_PWA.csproj
      - name: Publish
        env:
          RELEASE_VERSION: ${{ steps.latest_release.outputs.tag }}
        run: dotnet publish SFA_PWA/SFA_PWA.csproj -c Release -o publish
      - name: List published files
        run: ls -R publish/wwwroot
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_OCEAN_0A4D2F103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/wwwroot"
          skip_app_build: true
          skip_api_build: true
